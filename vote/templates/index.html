<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Voting Application!</title>
    <base href="/index.html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Docker">
    <link rel='stylesheet' href="{{ url_for('static',filename='stylesheets/style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div id="content-wrapper">
        <div class="header">
            <h1>Cast Your Vote!</h1>
            <p id="tip">(Tip: you can change your vote)</p>
        </div>

        <form id="choices" name='form' method="POST" action="/">
            <div class="choice-card" id="card-a">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDCsqRYLAFDdL4Ix_AHai7kNVyoPV9Ssv1xg&s" alt="A cute cat">
                <button id="a" type="submit" name="vote" value="a">
                    <span>{{option_a}}</span>
                </button>
            </div>
             <div class="choice-card" id="card-b">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbFFRoxRKvAy4N8m4cnfNYRuaXORma8CQ4ZwE5bDxBtqpZVvDhkX-YGH34mjIyi8wCBT4&usqp=CAU" alt="A happy dog">
                <button id="b" type="submit" name="vote" value="b">
                    <span>{{option_b}}</span>
                </button>
            </div>
            <div class="choice-card" id="card-c">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSEETxp515kUwztOnulWyjRySH4DGp_X2kpJw&s" alt="A colorful bird">
                <button id="c" type="submit" name="vote" value="c">
                    <span>{{option_c}}</span>
                </button>
            </div>
            <div class="choice-card" id="card-d">
                <img src="https://static.vecteezy.com/system/resources/previews/060/635/674/large_2x/a-playful-monkey-sitting-on-a-branch-expressing-excitement-in-a-lush-green-environment-photo.jpg" alt="A playful monkey">
                <button id="d" type="submit" name="vote" value="d">
                    <span>{{option_d}}</span>
                </button>
            </div>
        </form>

        <div id="hostname">
            Processed by container ID <span class="host-id">{{hostname}}</span>
        </div>
    </div>

    {% if vote %}
    <script>
      var vote = "{{vote}}";
      ['a', 'b', 'c', 'd'].forEach(function(option) {
        var card = document.getElementById('card-' + option);
        if (option === vote) {
          card.classList.add('selected');
        } else {
          card.classList.remove('selected');
        }
      });
    </script>
    {% endif %}
</body>
</html>
