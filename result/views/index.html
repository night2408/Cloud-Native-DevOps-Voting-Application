<!DOCTYPE html>
<html ng-app="catsvsdogs">
  <head>
    <meta charset="utf-8">
    <title>Voting Results</title>
    <base href="/index.html">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Docker">
    <link rel='stylesheet' href='/stylesheets/style.css' />
  </head>
  <body ng-controller="statsCtrl">
    <div id="content-container">
        <h1 class="title">Live Results</h1>
        <div id="results-wrapper">

            <div class="result-bar">
                <div class="label">Cats</div>
                <div class="bar-container">
                    <div id="background-stats-1" class="bar"></div>
                </div>
                <div class="stat">{{aPercent | number:1}}%</div>
            </div>

            <div class="result-bar">
                <div class="label">Dogs</div>
                <div class="bar-container">
                    <div id="background-stats-2" class="bar"></div>
                </div>
                <div class="stat">{{bPercent | number:1}}%</div>
            </div>

            <div class="result-bar">
                <div class="label">Birds</div>
                <div class="bar-container">
                    <div id="background-stats-3" class="bar"></div>
                </div>
                <div class="stat">{{cPercent | number:1}}%</div>
            </div>

            <div class="result-bar">
                <div class="label">Monkey</div>
                <div class="bar-container">
                    <div id="background-stats-4" class="bar"></div>
                </div>
                <div class="stat">{{dPercent | number:1}}%</div>
            </div>

        </div>
        <div id="result">
          <span ng-if="total == 0">No votes yet</span>
          <span ng-if="total > 0">Total votes: {{total}}</span>
        </div>
    </div>
    <script src="socket.io.js"></script>
    <script src="angular.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
